apiVersion: apps/v1
kind: Deployment
metadata:
  name: batbin-frontend
  namespace: batbin
  labels:
    app: batbin-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batbin-frontend
  template:
    metadata:
      labels:
        app: batbin-frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: batbin-frontend
  namespace: batbin
spec:
  selector:
    app: batbin-frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: batbin-frontend
  namespace: batbin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: umbra.batbin.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: batbin-frontend
                port:
                  number: 80
